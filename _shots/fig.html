<!doctype html>
<html lang="en-AU"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&display=swap">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#F2F0E8}
  .stage{position:relative;width:1440px;height:1080px;margin:26px}
  iframe{width:1440px;height:1080px;border:1px solid #DCD7C9;background:#F2F0E8;display:block}
  .pin{position:absolute;width:26px;height:26px;border-radius:50%;background:#AF2A20;color:#fff;
       font-family:"IBM Plex Mono",monospace;font-size:14px;font-weight:500;
       display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px rgba(0,0,0,.28);z-index:5}
</style></head><body>
<div class="stage"><iframe id="fr" src="http://localhost:8317/prototype/incident.html" scrolling="no"></iframe></div>
<script>
(function(){
  var S={"step": "", "scroll": 170, "pins": [".band", ".step:first-of-type .b b", ".never"]};
  var f=document.getElementById('fr');
  f.addEventListener('load',function(){
    var w=f.contentWindow,d=f.contentDocument;
    try{ d.documentElement.setAttribute('data-theme','light');
         w.localStorage.setItem('redline.theme','light'); }catch(e){}
    try{ if(S.step){ (new Function('w','d',S.step))(w,d); } }catch(e){ console.log(e); }
    setTimeout(function(){
      try{ if(S.scroll){ d.documentElement.scrollTop=S.scroll; d.body.scrollTop=S.scroll; } }catch(e){}
      setTimeout(function(){
        var stage=document.querySelector('.stage');
        S.pins.forEach(function(sel,i){
          var el=null; try{ el=d.querySelector(sel); }catch(e){}
          if(!el) { console.log('missing pin',sel); return; }
          var r=el.getBoundingClientRect();
          var p=document.createElement('div');
          p.className='pin'; p.textContent=String(i+1);
          p.style.left=Math.max(-13,r.left-13)+'px';
          p.style.top=Math.max(-13,r.top-13)+'px';
          stage.appendChild(p);
        });
        document.title='READY';
      },140);
    },260);
  });
})();
</script></body></html>
